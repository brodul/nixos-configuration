;; Nord-themed polybar for the Pi 4B i3 desktop.
;; Deployed to ~/.config/polybar/config.ini by home-rpizero.nix and launched
;; from the i3 startup. Text labels (not Nerd-Font PUA icons) are used on
;; purpose so the bar renders identically everywhere; the font still carries
;; icons if you want to add them later.

[colors]
background = #2E3440
background-alt = #3B4252
foreground = #D8DEE9
muted = #4C566A
primary = #88C0D0
secondary = #81A1C1
green = #A3BE8C
alert = #BF616A

[bar/main]
width = 100%
height = 30pt
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3pt
border-size = 0pt
padding-left = 1
padding-right = 1
module-margin = 1
separator = "  "
separator-foreground = ${colors.muted}

font-0 = JetBrainsMono Nerd Font:size=11;3
font-1 = Noto Sans:size=11;2

modules-left = i3
modules-center = date
modules-right = pulseaudio memory cpu temperature wlan

cursor-click = pointer
enable-ipc = true

tray-position = right
tray-maxsize = 20
tray-padding = 2
tray-background = ${colors.background}

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 1
label-mode-foreground = ${colors.background}
label-mode-background = ${colors.alert}

label-focused = %name%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.primary}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-padding = 1

label-visible = %name%
label-visible-background = ${colors.background-alt}
label-visible-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = %date%   %time%
format-foreground = ${colors.foreground}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = VOL %percentage%%
label-muted = VOL muted
label-muted-foreground = ${colors.muted}

[module/memory]
type = internal/memory
interval = 3
label = MEM %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 3
label = CPU %percentage%%

[module/temperature]
type = internal/temperature
interval = 5
thermal-zone = 0
warn-temperature = 70
format = <label>
format-warn = <label-warn>
label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = ${colors.alert}

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3
label-connected = %essid% %signal%%
label-connected-foreground = ${colors.foreground}
label-disconnected = offline
label-disconnected-foreground = ${colors.muted}

[settings]
screenchange-reload = true
pseudo-transparency = false
